<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMU Campus Tour</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">CMU Campus Tour</p>
        <h1>Carnegie Mellon Campus Route</h1>
      </div>
      <div class="lang-switch" aria-label="Language">
        <button class="active" data-lang="ko" type="button">한글</button>
        <button data-lang="en" type="button">EN</button>
      </div>
    </header>

    <main>
      <aside class="route-panel">
        <div class="route-panel__inner">
          <h2 data-copy="routeTitle">Route</h2>
          <nav id="routeNav" aria-label="Campus tour route"></nav>
        </div>
      </aside>

      <section class="content">
        <div class="intro">
          <p data-copy="intro">
            CMU 캠퍼스 투어 내용을 한글과 영어로 전환해 볼 수 있습니다.
          </p>
        </div>
        <div id="tour"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
