<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMU Campus Tour</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">CMU Campus Tour</p>
        <h1>Carnegie Mellon Campus Route</h1>
      </div>
      <div class="header-actions">
        <button class="toc-toggle" type="button" aria-expanded="false" aria-controls="routePanel">목차</button>
        <div class="lang-switch" aria-label="Language">
          <button class="active" data-lang="ko" type="button">KR</button>
          <button data-lang="en" type="button">EN</button>
        </div>
      </div>
    </header>

    <main>
      <aside class="route-panel" id="routePanel">
        <div class="route-panel__inner">
          <h2 data-copy="routeTitle">Route</h2>
          <nav id="routeNav" aria-label="Campus tour route"></nav>
        </div>
      </aside>

      <section class="content">
        <div class="intro">
          <p class="tour-meta"><strong>7/24/2026 CMU&amp;Pitt Campus Tour</strong></p>
          <p class="tour-author">Seongeun Park (seongeup@andrew.cmu.edu)</p>
        </div>
        <section class="map-preview" aria-label="CMU campus map">
          <div class="map-preview__header">
            <h2>Campus Map</h2>
            <a href="campus-map.pdf" target="_blank" rel="noreferrer">Open PDF</a>
          </div>
          <div class="map-legend" aria-label="Map color legend">
            <span><i class="legend-dot legend-dot--academic"></i>Academic/Admin</span>
            <span><i class="legend-dot legend-dot--poi"></i>Points of Interest</span>
            <span><i class="legend-dot legend-dot--parking"></i>Parking</span>
            <span><i class="legend-dot legend-dot--residential"></i>Residential</span>
          </div>
          <a href="campus-map.pdf" target="_blank" rel="noreferrer">
            <img src="campus-map.png" alt="Carnegie Mellon University campus map" />
          </a>
        </section>
        <div id="tour"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
